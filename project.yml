name: Herald
options:
  bundleIdPrefix: com.ivg
  deploymentTarget:
    # 13.1, not 13.0: the Rive runtime xcframework is built for macOS 13.1.
    macOS: "13.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "17"
packages:
  # Rive Apple runtime (a binary xcframework, macOS 13.1+). Only the Herald app target links it;
  # HeraldClient stays dependency-free. Pinned: Rive's Swift API still moves between minor releases.
  Rive:
    url: https://github.com/rive-app/rive-ios
    exactVersion: 6.28.0
targets:
  Herald:
    type: application
    platform: macOS
    sources:
      - path: Sources/Herald
      - path: Sources/HeraldClient
      # The Kokoro speech worker (DESIGN section 7.9) ships as a bundle resource, run by the venv's python.
      - path: Resources/tts_worker.py
        buildPhase: resources
      - path: Resources/relay
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Rive
        product: RiveRuntime
      # The MCP server and CLI ship inside the app (Contents/Helpers), signed with it.
      - target: herald-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: herald-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Herald
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg.herald
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Herald
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 IVG"
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Herald adds a reminder when you press Add to Reminders on a notification."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Herald records a short voice reply when you press Record on a notification from a cloud agent. Recording only starts when you press it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Herald turns your voice reply into text on this Mac, so the agent that asked can read it. The audio is not sent to Apple."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Herald adds a reminder when you press Add to Reminders on a notification."
        CODE_SIGN_ENTITLEMENTS: Resources/Herald.entitlements
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "17"
        # Signing / notarization (see ~/github/NOTARIZATION.md)
        DEVELOPMENT_TEAM: 7S422NVLUK
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp"

  herald-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/herald-mcp
    dependencies:
      - target: HeraldClient
    settings:
      base: &toolsettings
        PRODUCT_NAME: herald-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg.herald.mcp
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "17"
        DEVELOPMENT_TEAM: 7S422NVLUK
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        SKIP_INSTALL: YES
  # Target is named herald-cli (not herald): "herald.build" would collide with "Herald.build" on a
  # case-insensitive file system. The product is still named `herald`.
  herald-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/herald-cli
    dependencies:
      - target: HeraldClient
    settings:
      base:
        <<: *toolsettings
        PRODUCT_NAME: herald
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg.herald.cli
  # The dependency-free client library the two tools import (the app compiles the same sources directly).
  HeraldClient:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/HeraldClient
    settings:
      base:
        PRODUCT_NAME: HeraldClient
        PRODUCT_MODULE_NAME: HeraldClient
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
